defaults:
  - system: go2
  - model: quadruped_world_model
  - loss: world_model_dynamics_only
  - heads: world_model_dynamics_only
  - _self_

run_name:

# Value adaptation options (used with loss=world_model_value_adapt):
#   value_residual: add a zero-initialized residual head delta(z, cmd); train it with
#                   heads=dynamics_value_residual
#   value_anchor:   keep a frozen copy of the pretrained value head as the bootstrap
#                   target (otherwise the head being trained bootstraps itself)
adapt:
  value_residual:
    enabled: false
    hidden_dims: [128, 128]
  value_anchor: false

data:
  dataset_name:
  num_train_workers: 8
  num_test_workers: 4
  prefetch_factor: 2

training:
  num_epochs: 100
  max_steps:  # will train until num_epochs, or max_steps (if given), whichever is first
  eval_interval: 10000  # evaluates and checkpoints at this interval
  learning_rate: 0.0002
  warmup_steps: 2000
  decay_steps: 400000
  end_learning_rate: 0.0001
  batch_size: 32
  training_data_ratio: 0.95  # portion of dataset to use for training; the rest is used for evaluation
  seed: 42

checkpoint:
  # create a checkpoint in this directory with the given run name, if resume_checkpoint is not set
  enabled: True
  # keeps this many most recent checkpoints; leave blank to keep all
  max_to_keep: 3
  # if non-empty, resume from this checkpoint
  resume_checkpoint:

wandb:
  log: False
  project: simdist_train_model
  entity:
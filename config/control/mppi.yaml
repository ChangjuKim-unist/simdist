num_samples: 450
iterations: 8 # number of MPPI iterations before taking a step
delay: 1  # the number of anticipated steps the controller takes to run
mixture_coef: 0.05
min_std: 0.05
base_act_std: 0.05
init_std: 2.0
num_elites: 64
temperature: 0.25
momentum: 0.0
discount: 0.99
seed: 42
init_mode: shift  # sampling-mean initialization: shift (warm start) | zero | prior | external (batched planner only)
prior_only: false  # true = execute the (external) prior's own plan without planning (student alone)
# design doc 7 planner options
noise_schedule:
  enabled: false
  iter_decay: 1.0     # sampling std x exp(-iter_decay * i/(I-1)) over MPPI iterations
  horizon_decay: 1.0  # sampling std x exp(-horizon_decay * (T-1-t)/(T-1)): less noise near the current step
consistency_gate:
  enabled: false
  factor: 3.0   # gate when ||z_actual - z_predicted|| > factor x running per-robot median
  window: 200   # steps of distance history for the median
# design doc 15: calibrated planner score (quantile head trained on the planner's own traces)
calib:
  enabled: false
  weights: null   # .npz from scripts/sim2sim/calib_head.py
  tau: 0.1        # which quantile of the realised return scores a candidate (0.1 / 0.5 / 0.9)
  fall_max: null  # exclude candidates whose predicted fall probability exceeds this (null = off)
# design doc 16: generative-prior candidates (conditional VAE decoder, CEM in its latent space)
gen:
  enabled: false
  weights: null    # .npz from scripts/sim2sim/gen_chunks.py
  dec_noise: 0.0   # multiply the decoder's per-dimension sigma for extra sampling noise (0 = candidates vary only through u)
  min_std_u: 0.05  # lower bound of the latent sampling std across CEM iterations

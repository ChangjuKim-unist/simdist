dataset: sim2sim_very_weak_motor_priorfirst_b45000   # real-format processed dataset (datasets/real/<name>/processed_data_<system>_H-25_T-25)
system: go1
grid: {lo: 0.2, hi: 1.2, n: 21}   # candidate motor-strength scales
replicas: 18       # robots per candidate (parallel segments)
seg_len: 20        # replayed steps per segment (0.4 s)
skip: 4            # steps after the reset not scored (transient)
rounds: 60         # segments per robot
friction: 0.8      # fixed friction when friction_grid is empty
add_mass: 0.0      # fixed added mass when mass_grid is empty
friction_grid: []  # e.g. [0.15, 0.3, 0.5, 0.8, 1.0] for a 3-axis grid
mass_grid: []      # e.g. [0.0, 1.5, 3.0, 4.5]
seed: 0
out:
# scoring (design doc 10 §4): weight steps by the logged PD torque demand relative to the nominal limit, joint-space error only
demand_weight: true
joint_only: true
kp: 25.0
kd: 0.5
tau_nominal: 23.7
action_scale: 0.25
